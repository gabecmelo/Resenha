<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resenha</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EFE4D2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141210" />

    <!--
      A prévia do link no WhatsApp, no Discord, no Telegram e afins.

      Sem isto, colar resenha.dev.br numa conversa não mostra nada além da URL
      crua — e o convite pra jogar quase sempre chega por link colado num grupo,
      que é exatamente onde a prévia decide se alguém abre.

      A imagem sai de `scripts/og-card.html` via `npm run og`. O `?v=` existe
      porque os leitores de prévia cacheiam a imagem por muito tempo e ignoram
      o cabeçalho de cache: trocar o cartão exige subir esse número, senão as
      conversas antigas seguem mostrando a versão anterior.

      As URLs são as de produção mesmo no bundle do beta. O beta é ambiente de
      teste com a mesa, não endereço que se compartilha — manter dois cartões
      custaria mais do que resolve.
    -->
    <meta
      name="description"
      content="Party games no navegador pra jogar com os amigos: Quem Sou Eu?, Espião, Cartas Contra a Turma e Enigmas Sinistros. Sem instalar nada e sem cadastro — cria a sala, manda o código de 5 letras e joga."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Resenha" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://resenha.dev.br/" />
    <meta property="og:title" content="Resenha — junta a galera e abre a mesa" />
    <meta
      property="og:description"
      content="Party games no navegador. Sem app, sem cadastro — cria a sala, manda o código, joga."
    />
    <meta property="og:image" content="https://resenha.dev.br/og.png?v=1" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Cartão do Resenha: 'Junta a galera e abre a mesa', com os quatro jogos disponíveis."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Resenha — junta a galera e abre a mesa" />
    <meta
      name="twitter:description"
      content="Party games no navegador. Sem app, sem cadastro — cria a sala, manda o código, joga."
    />
    <meta name="twitter:image" content="https://resenha.dev.br/og.png?v=1" />
    <!--
      Fontes do handoff de design. `display=swap` deixa o texto pintar de
      imediato na fonte de sistema, então a primeira pintura não espera a rede.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
