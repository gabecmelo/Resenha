<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      O titulo tambem e a etiqueta da aba durante a partida, entao ele nao pode
      ser uma fila de palavra-chave. "Resenha" sozinho tambem nao servia: ele
      nao aparece em busca nenhuma, porque ninguem procura pelo nome de um
      produto que ainda nao conhece.
    -->
    <title>Resenha — party games no navegador pra jogar com os amigos</title>
    <link rel="canonical" href="%ORIGEM%/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EFE4D2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141210" />

    <!--
      A prévia do link no WhatsApp, no Discord, no Telegram e afins.

      Sem isto, colar resenha.dev.br numa conversa não mostra nada além da URL
      crua — e o convite pra jogar quase sempre chega por link colado num grupo,
      que é exatamente onde a prévia decide se alguém abre.

      A imagem sai de `scripts/og-card.html` via `npm run og`. O `?v=` existe
      porque os leitores de prévia cacheiam a imagem por muito tempo e ignoram
      o cabeçalho de cache: trocar o cartão exige subir esse número, senão as
      conversas antigas seguem mostrando a versão anterior.

      `%ORIGEM%` é trocado no build (`vite.config.ts`): o beta anuncia o beta e a
      produção anuncia a produção. Fixar um endereço só faria o beta apontar
      pra uma imagem hospedada noutro deploy.
    -->
    <meta
      name="description"
      content="Party games no navegador pra jogar com os amigos: Quem Sou Eu?, Espião, Cartas Contra a Turma e Enigmas Sinistros. Sem instalar nada e sem cadastro — cria a sala, manda o código de 5 letras e joga."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Resenha" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="%ORIGEM%/" />
    <meta property="og:title" content="Resenha — junta a galera e abre a mesa" />
    <meta
      property="og:description"
      content="Party games no navegador. Sem app, sem cadastro — cria a sala, manda o código, joga."
    />
    <meta property="og:image" content="%ORIGEM%/og.png?v=1" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Cartão do Resenha: 'Junta a galera e abre a mesa', com os quatro jogos disponíveis."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Resenha — junta a galera e abre a mesa" />
    <meta
      name="twitter:description"
      content="Party games no navegador. Sem app, sem cadastro — cria a sala, manda o código, joga."
    />
    <meta name="twitter:image" content="%ORIGEM%/og.png?v=1" />

    <!--
      Dados estruturados: dizem ao buscador o que este endereco e, em vez de
      deixar que ele deduza de um `<div id="root">` vazio. A lista de jogos e o
      unico caminho de descoberta que a home oferece hoje — o app e pintado por
      JavaScript, entao nao ha link em HTML pras paginas de jogo.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Resenha",
        "alternateName": "Resenha — party games no navegador",
        "url": "%ORIGEM%/",
        "inLanguage": "pt-BR",
        "description": "Party games no navegador pra jogar com os amigos. Sem instalar nada e sem cadastro.",
        "publisher": { "@type": "Organization", "name": "Resenha", "url": "%ORIGEM%/" },
        "hasPart": [
          {
            "@type": "VideoGame",
            "name": "Quem Sou Eu?",
            "url": "%ORIGEM%/quem-sou-eu",
            "playMode": "MultiPlayer",
            "gamePlatform": "Navegador de internet"
          },
          {
            "@type": "VideoGame",
            "name": "Espião",
            "url": "%ORIGEM%/espiao",
            "playMode": "MultiPlayer",
            "gamePlatform": "Navegador de internet"
          },
          {
            "@type": "VideoGame",
            "name": "Cartas Contra a Turma",
            "url": "%ORIGEM%/cartas-contra-a-turma",
            "playMode": "MultiPlayer",
            "gamePlatform": "Navegador de internet"
          },
          {
            "@type": "VideoGame",
            "name": "Enigmas Sinistros",
            "url": "%ORIGEM%/enigmas-sinistros",
            "playMode": "MultiPlayer",
            "gamePlatform": "Navegador de internet"
          }
        ]
      }
    </script>
    <!--
      Fontes do handoff de design. `display=swap` deixa o texto pintar de
      imediato na fonte de sistema, então a primeira pintura não espera a rede.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
